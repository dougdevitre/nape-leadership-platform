name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check JavaScript
        run: |
          node --check api/interest.js
          node --check api/feedback.js
          node --check api/agencies.js
          node --check api/connections.js
          node --check api/media.js
          node --check assets/app.js
          node --check assets/connections.js
          node --check assets/media.js
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: node scripts/smoke.js
